<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine? 💕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            cursor: none;
        }

        .hearts-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .heart {
            position: absolute;
            color: #ff69b4;
            font-size: 18px;
            opacity: 0.7;
            animation: floatHeart 8s linear infinite;
        }

        @keyframes floatHeart {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            padding: 60px 40px;
            border-radius: 30px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 450px;
            width: 90%;
            position: relative;
            z-index: 10;
        }

        .emoji {
            font-size: 4em;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        h1 {
            color: #e91e63;
            font-size: 2.8em;
            margin-bottom: 20px;
            font-weight: 800;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .question {
            font-size: 1.6em;
            color: #333;
            margin-bottom: 50px;
            line-height: 1.4;
        }

        .buttons {
            position: relative;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button {
            position: absolute;
            padding: 18px 45px;
            font-size: 1.3em;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            z-index: 20;
        }

        #yesBtn {
            background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%);
            color: white;
            left: 50%;
            transform: translateX(-120%);
            min-width: 140px;
        }

        #yesBtn:hover {
            transform: translateX(-120%) scale(1.1);
            box-shadow: 0 15px 40px rgba(233, 30, 99, 0.4);
        }

        #noBtn {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            color: #333;
            left: 50%;
            transform: translateX(20%);
            min-width: 120px;
            transition: all 0.2s ease;
        }

        #noBtn:hover {
            transform: translateX(20%) scale(1.05);
        }

        .success-screen {
            display: none;
            animation: celebrate 1s ease-out;
        }

        @keyframes celebrate {
            0% { opacity: 0; transform: scale(0.5); }
            100% { opacity: 1; transform: scale(1); }
        }

        .success-emoji {
            font-size: 6em;
            margin-bottom: 20px;
        }

        .success-title {
            color: #e91e63;
            font-size: 3em;
            margin-bottom: 20px;
            font-weight: 800;
        }

        .success-text {
            font-size: 1.4em;
            color: #333;
            line-height: 1.5;
        }

        .confetti {
            position: fixed;
            width: 12px;
            height: 12px;
            background: #ff6b9d;
            animation: confettiFall 3s linear infinite;
            z-index: 30;
        }

        @keyframes confettiFall {
            0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        @media (max-width: 600px) {
            h1 { font-size: 2.2em; }
            .question { font-size: 1.3em; }
            button { padding: 15px 35px; font-size: 1.1em; }
            .container { padding: 40px 25px; }
        }
    </style>
</head>
<body>
    <div class="hearts-bg" id="hearts"></div>
    
    <div class="container">
        <div class="main-screen" id="mainScreen">
            <div class="emoji">💝</div>
            <h1>Hey Beautiful!</h1>
            <p class="question">Will you be my Valentine? 💕</p>
            <div class="buttons">
                <button id="yesBtn">Yes! 😍</button>
                <button id="noBtn">No</button>
            </div>
        </div>

        <div class="success-screen" id="successScreen">
            <div class="success-emoji">🎉✨💖</div>
            <h1 class="success-title">YASSS QUEEN! 🎊</h1>
            <p class="success-text">I knew you'd say yes! You just made me the happiest person alive! 💕<br>Let's make this Valentine's Day unforgettable! 🌹</p>
        </div>
    </div>

    <script>
        // Floating hearts background
        function createHearts() {
            const heartsContainer = document.getElementById('hearts');
            for (let i = 0; i < 15; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.innerHTML = '💖';
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDelay = Math.random() * 6 + 's';
                heart.style.animationDuration = (Math.random() * 4 + 6) + 's';
                heartsContainer.appendChild(heart);
            }
        }
        createHearts();

        // No button follows mouse and runs away
        let noClicks = 0;
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');

        document.addEventListener('mousemove', (e) => {
            if (noBtn.style.display !== 'none' && noClicks < 5) {
                const mouseX = e.clientX / window.innerWidth;
                
                // Run to opposite side of mouse
                const runAwayX = mouseX > 0.5 
                    ? Math.random() * 0.3 * window.innerWidth
                    : (0.7 + Math.random() * 0.2) * window.innerWidth;
                
                const runAwayY = (0.3 + Math.random() * 0.4) * window.innerHeight;
                
                noBtn.style.left = runAwayX + 'px';
                noBtn.style.top = runAwayY + 'px';
            }
        });

        // Button clicks
        noBtn.addEventListener('click', () => {
            noClicks++;
            if (noClicks >= 3) {
                noBtn.style.transform = 'scale(0.1)';
                setTimeout(() => {
                    noBtn.style.display = 'none';
                }, 200);
            }
        });

        yesBtn.addEventListener('click', () => {
            document.getElementById('mainScreen').style.display = 'none';
            document.getElementById('successScreen').style.display = 'block';
            createConfetti();
            document.body.style.background = 'linear-gradient(135deg, #ff9a8b 0%, #ff6b9d 50%, #c44569 100%)';
        });

        // Confetti explosion
        function createConfetti() {
            const colors = ['#ff6b9d', '#ff9a9e', '#fecfef', '#a8edea', '#ffd700'];
            for (let i = 0; i < 80; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDelay = Math.random() * 0.5 + 's';
                confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                document.body.appendChild(confetti);
                
                setTimeout(() => confetti.remove(), 4000);
            }
        }
    </script>
</body>
</html>
